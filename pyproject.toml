[project]
name = "generation-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "asyncpg", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

# Код запускается из /srv (монтируется или копируется), пакет не устанавливаем:
# pip нужен только ради зависимостей.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
